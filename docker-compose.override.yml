# Local-dev only. Auto-loaded by `docker compose up` when no -f flags are
# passed. Production and sandbox stacks invoke compose with explicit -f flags
# and never load this file.
services:
  web:
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app:z
    ports:
      - "8000:8000"
    env_file:
      - .env

  # Dev runs the notifier loop like production, so immediate emails and
  # digests deliver automatically. With real Mailjet keys in .env this
  # sends real mail; blank the keys to route email to console instead.
  notifier:
    build:
      context: .
      args:
        INSTALL_PLAYWRIGHT: "1"
    command: python manage.py notifier_loop
    volumes:
      - .:/app:z
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
