services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-osprey}
      POSTGRES_USER: ${POSTGRES_USER:-osprey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-osprey}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-osprey}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      args:
        INSTALL_PLAYWRIGHT: "1"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
