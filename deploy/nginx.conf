# Redirect www to the canonical host if that DNS name is configured later.
server {
    listen 80;
    listen [::]:80;
    server_name www.osprey.phalkon.io;
    return 301 https://osprey.phalkon.io$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name osprey.phalkon.io;

    # certbot --nginx will rewrite this block to redirect to HTTPS and add the
    # listen 443 ssl block with the Let's Encrypt certificate paths.

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        client_max_body_size 512m;
    }

    location /static/ {
        alias /srv/osprey/staticfiles/;
        access_log off;
        expires 7d;
    }

    location /media/ {
        alias /srv/osprey/media/;
        access_log off;
        expires 7d;
    }
}
