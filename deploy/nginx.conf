server {
    listen 80;
    listen [::]:80;
    server_name osprey.phalkon.io;

    # certbot --nginx will rewrite this block to redirect to HTTPS and add the
    # listen 443 ssl block with the Let's Encrypt certificate paths.

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        client_max_body_size 512m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /static/ {
        alias /srv/osprey-prod/staticfiles/;
        access_log off;
        expires 7d;
    }

    location /media/ {
        alias /srv/osprey-prod/media/;
        access_log off;
        expires 7d;
    }
}

