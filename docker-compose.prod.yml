services:
  db:
    volumes:
      - /srv/osprey/postgres:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    command: gunicorn osprey.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - /srv/osprey/staticfiles:/app/staticfiles
      - /srv/osprey/media:/app/media
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - /etc/osprey/.env.prod
    restart: unless-stopped

volumes:
  postgres_data: {}
