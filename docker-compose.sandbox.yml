services:
  db:
    env_file:
      - /etc/osprey/.env.sandbox
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in /etc/osprey/.env.sandbox}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in /etc/osprey/.env.sandbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in /etc/osprey/.env.sandbox}
    volumes:
      - /srv/osprey-sandbox/postgres:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build:
      args:
        INSTALL_PLAYWRIGHT: "0"
    command: gunicorn osprey.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 600 --graceful-timeout 90
    volumes:
      - /srv/osprey-sandbox/staticfiles:/app/staticfiles
      - /srv/osprey-sandbox/media:/app/media
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - /etc/osprey/.env.sandbox
    restart: unless-stopped

  notifier:
    build:
      args:
        INSTALL_PLAYWRIGHT: "0"
    command: python manage.py notifier_loop
    env_file:
      - /etc/osprey/.env.sandbox
    restart: unless-stopped
    depends_on:
      - db
